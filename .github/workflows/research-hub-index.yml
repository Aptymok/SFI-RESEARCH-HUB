name: Research Hub public-package index

on:
  push:
    branches: [main]
    paths:
      - '05_RESEARCH_OBJECTS/**'
      - '05_AUDITS/**'
      - 'scripts/sync_research_hub.py'
      - '.github/workflows/research-hub-index.yml'
  pull_request:
    paths:
      - '05_RESEARCH_OBJECTS/**'
      - '05_AUDITS/**'
      - 'REPORTING/OBJECT_INDEX.md'
      - 'scripts/sync_research_hub.py'
      - '.github/workflows/research-hub-index.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify transferred packages and derived inventory are synchronized
        run: python scripts/sync_research_hub.py --check

  update:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recompute public inventory only after authorized package transport
        run: python scripts/sync_research_hub.py
      - name: Persist derived inventory (never hypothesis, publication or research state)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add REPORTING/OBJECT_INDEX.md
          if ! git diff --cached --quiet; then
            git commit -m "docs: refresh derived Research Hub package inventory"
            git push
          fi
